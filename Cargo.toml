[workspace]
resolver = '3'
members = ["nanocesu8", "nanonbt", "nanonbt-derive"]
# `benchmarks` stays outside the workspace: it compares against `simdnbt`,
# which needs a nightly compiler, while CI builds the workspace on the pinned
# stable toolchain. Run it with `benches/run.sh`.
exclude = ["benchmarks"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nanocesu8 = { path = "nanocesu8" }
nanonbt = { path = "nanonbt", version = "0.1.0" }
nanonbt-derive = { path = "nanonbt-derive", version = "0.1.0" }
hashify = "0.3"
pulp = { version = "0.22.3", default-features = false, features = ["x86-v3"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit"] }
testkit = { path = "testkit" }

# `codegen-units = 1` and `lto` keep the release build of the `pulp`-backed
# `simd` code compiling for the bare-metal `x86_64-unknown-none` target, which
# the no-std CI job builds.
[profile.release]
lto = true
codegen-units = 1

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
ptr_arg = "warn"
manual_memcpy = "warn"
manual_slice_fill = "warn"
iter_count = "warn"
bytes_count_to_len = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
str_to_string = "warn"
format_push_string = "warn"
rc_buffer = "warn"
string_add = "warn"
string_add_assign = "warn"

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

module_name_repetitions = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
