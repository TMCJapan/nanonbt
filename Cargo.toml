[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
nanonbt = { path = "crates/nanonbt" }
nanonbt-derive = { path = "crates/nanonbt-derive" }
proc-macro2 = "1"
quote = "1"
rt-client = { path = "crates/rt-client" }
rt-core = { path = "crates/rt-core" }
rt-derive = { path = "crates/rt-derive" }
rt-fixtures = { path = "crates/rt-fixtures" }
rt-net = { path = "crates/rt-net" }
rt-object = { path = "crates/rt-object" }
rt-proto = { path = "crates/rt-proto" }
rt-sim = { path = "crates/rt-sim" }
rt-testkit = { path = "crates/rt-testkit" }
syn = { version = "3", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
# Kani proofs are compiled only under `cargo kani`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
ptr_arg = "warn"
manual_memcpy = "warn"
manual_slice_fill = "warn"
iter_count = "warn"
bytes_count_to_len = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
str_to_string = "warn"
format_push_string = "warn"
rc_buffer = "warn"
string_add = "warn"
string_add_assign = "warn"

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

module_name_repetitions = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

# Property and simulation suites run many thousands of cases.
[profile.test]
opt-level = 1
