[package]
name = "nanonbt-kani"
description = "Kani model-checking proofs that nanonbt agrees with fastnbt byte for byte"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# Pinned exactly, because `cargo kani` takes no `--locked`: what these
# proofs attest is agreement with the fastnbt the rest of CI tests against.
[dependencies]
fastnbt = "=2.6.3"
nanonbt.workspace = true
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
