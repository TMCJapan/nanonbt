[package]
name = "nanonbt-bench"
description = "Comparison benchmarks: nanonbt against fastnbt, simdnbt and pumpkin-nbt"
publish = false
edition = "2024"
version = "0.1.0"

# A workspace of its own, excluded from the root one: `simdnbt` needs nightly,
# and the rest of the repository pins a stable toolchain.
[workspace]
resolver = "2"

[dev-dependencies]
criterion = "0.8"
fastnbt = "2.6.3"
nanonbt = { path = "../nanonbt", features = ["serde"] }
# pumpkin-nbt is not on crates.io; the rev is the API the bench was written
# against.
pumpkin-nbt = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "218a7fe46767235a917f94ba1120afbd33e7ef8c" }
serde = { version = "1", features = ["derive"] }
simdnbt = "0.10"

[[bench]]
name = "compare"
harness = false

# Mirrors the root workspace, so the numbers describe the same build.
[profile.release]
lto = true
codegen-units = 1
