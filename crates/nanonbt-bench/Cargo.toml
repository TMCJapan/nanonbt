[package]
name = "nanonbt-bench"
description = "Benchmarks: nanonbt against fastnbt, simdnbt and pumpkin-nbt, and nanocesu8 under callgrind"
publish = false
edition = "2024"
version = "0.1.0"

# A workspace of its own, excluded from the root one: `simdnbt` needs nightly,
# and the rest of the repository pins a stable toolchain.
[workspace]
resolver = "2"

# The portable registry, the smoke runner and the wasm fuel runner share this
# library; the iai entry files are also compiled into it, with the portable
# macro backend in `src/macros.rs` instead of the `iai-callgrind` one.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# The three comparison targets, all in `default`, so all benchmarks run out of
# the box.
fastnbt = { version = "2.6.3", optional = true }
pumpkin-nbt = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "218a7fe46767235a917f94ba1120afbd33e7ef8c", optional = true }
simdnbt = { version = "0.10", optional = true }
# The libraries under test, the document builder and the name generator; the
# entry files compile against these in every backend. `nanocesu8` is a direct
# edge for the callgrind target `benches/nanocesu8.rs`; the comparison suite
# reaches it through `nanonbt`.
nanocesu8 = { path = "../nanocesu8" }
nanonbt = { path = "../nanonbt", features = ["serde"] }
random-names = { path = "random-names" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The host side of the wasm fuel runner. The wasm module itself never links
# this. `simd` lets it load a module built for the wasm SIMD target feature,
# which is what the runner builds when it benches the library's `simd`.
wasmi = { version = "0.51", features = ["std", "simd"] }
# The fuel runner and the summary example read and write JSON.
serde_json = "1"

[dev-dependencies]
iai-callgrind = "0.16.1"

[features]
default = ["fastnbt", "hashify", "pumpkin-nbt", "simdnbt"]
# Enable the fastnbt benchmarks.
fastnbt = ["dep:fastnbt"]
# Enable nanonbt's `hashify` feature, so the derived reads dispatch names
# through its lookups.
hashify = ["nanonbt/hashify"]
# Enable the pumpkin-nbt benchmarks (always listed last).
pumpkin-nbt = ["dep:pumpkin-nbt"]
# Enable the simdnbt benchmarks. simdnbt does not build for wasm32, so the
# wasm fuel runner leaves this off.
simdnbt = ["dep:simdnbt"]
# Enable nanonbt's and nanocesu8's `simd` features, to compare the vector
# decode and the CESU-8 scans.
simd = ["nanocesu8/simd", "nanonbt/simd"]

[[bench]]
name = "compare"
harness = false

# The nanocesu8 entries, measured alone under callgrind; see the file's docs.
[[bench]]
name = "nanocesu8"
harness = false

# Mirrors the root workspace, so the numbers describe the same build.
[profile.release]
lto = true
codegen-units = 1

# Iai-Callgrind needs debug symbols to match the names callgrind reports, so
# the measurement collects the benchmark function and nothing else around it.
[profile.bench]
debug = true
