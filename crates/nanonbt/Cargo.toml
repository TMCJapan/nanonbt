[package]
name = "nanonbt"
description = "no_std support for Minecraft's NBT format, byte-compatible with fastnbt"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["derive"]
# Re-exports `#[derive(FromNBT, ToNBT)]` as `nanonbt::{FromNBT, ToNBT}`.
derive = ["dep:nanonbt-derive"]
# Keeps the `Serialize`/`Deserialize` implementations and `serde_compat`.
serde = ["dep:serde"]
# Vectorizes nanocesu8's string validation and encode fast-path scan.
simd = ["nanocesu8/simd"]

[dependencies]
nanocesu8.workspace = true
nanonbt-derive = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = [
  "alloc",
], optional = true }

[dev-dependencies]
fastnbt = "2.6.3"
testkit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[lints]
workspace = true
