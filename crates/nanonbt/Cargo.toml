[package]
name = "nanonbt"
description = "no_std serde support for Minecraft's NBT format, byte-compatible with fastnbt"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
cesu8 = "1.1"
fastnbt = "2.6.3"
rt-testkit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[lints]
workspace = true
