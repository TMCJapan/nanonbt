[package]
name = "nanocesu8-kani"
description = "Kani model-checking proofs that nanocesu8 agrees with the cesu8 crate"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# Pinned exactly, because `cargo kani` takes no `--locked`: what these
