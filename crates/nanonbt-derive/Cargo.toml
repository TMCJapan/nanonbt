[package]
name = "nanonbt-derive"
description = "Derive macros for nanonbt's FromNBT and ToNBT"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
# Emits `hashify::fnc_map!` dispatch for the names a read sees instead of a
# plain `match`. Enabled through `nanonbt/hashify`, whose re-export of
# hashify is where the generated code finds the macro.
hashify = []

[dependencies]
nanocesu8.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true
