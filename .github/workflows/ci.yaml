name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Pinned, so that lints added by a new release cannot fail an unchanged
  # tree. This is the toolchain every job builds with; the `msrv` job checks
  # the workspace's older `rust-version` separately.
  RUST_TOOLCHAIN: 1.98.1

jobs:
  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos
      - run: typos

  taplo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - run: taplo fmt --check --diff

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # Clippy, tests, doctests and release-mode tests on every host platform.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2025
          - name: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: nextest
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked
      - name: nextest --release
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final --release

  # The crates that must build without std.
  no-std:
    name: no-std (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabi, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: clippy
        run: cargo clippy -p nanonbt -p nanocesu8 --target ${{ matrix.target }} --locked -- -D warnings
      # `nanonbt`'s bare traits — the derive macro is a host build dependency
      # — must still cross-compile without its default features.
      - name: clippy (no default features)
        run: cargo clippy -p nanonbt --target ${{ matrix.target }} --no-default-features --locked -- -D warnings
      - name: build
        run: cargo build -p nanonbt -p nanocesu8 --target ${{ matrix.target }} --locked --release
      - name: build (no default features)
        run: cargo build -p nanonbt --target ${{ matrix.target }} --no-default-features --locked --release
      # `nanocesu8`'s `simd` feature must stay no_std as well; `pulp` and
      # `simdutf8` are no_std with their default features off.
      - name: clippy (simd)
        run: cargo clippy -p nanocesu8 -p nanonbt --features nanocesu8/simd --target ${{ matrix.target }} --locked -- -D warnings
      - name: build (simd)
        run: cargo build -p nanocesu8 -p nanonbt --features nanocesu8/simd --target ${{ matrix.target }} --locked --release
      # The `hashify` feature re-exports, for the generated reads to call, the
      # macro that builds their lookups; the re-export must stay no_std too.
      - name: clippy (hashify)
        run: cargo clippy -p nanonbt --features hashify --target ${{ matrix.target }} --locked -- -D warnings

  # Every feature on its own, so a feature that only compiles next to another
  # cannot hide in the all-features build above.
  features:
    name: features (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [nanocesu8, nanonbt, nanonbt-derive]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: each feature
        run: cargo hack check -p ${{ matrix.package }} --each-feature --locked

  # The documentation must build without warnings, which is also where the
  # intra-doc links and the `missing_docs` lint are enforced workspace-wide.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  # The oldest Rust the workspace claims to support.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: read the workspace rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: check
        run: cargo check --workspace --all-targets --all-features --locked

  # One required check for branch protection.
  ci:
    if: always()
    needs: [typos, taplo, fmt, machete, test, no-std, features, docs, msrv]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
