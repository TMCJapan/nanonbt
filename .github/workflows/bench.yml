name: Bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The comparison bench needs `simdnbt`, which uses nightly features. Pinned
  # for the same reason as the stable toolchain in ci.yml; keep the two in
  # step.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-09-17

jobs:
  compare:
    name: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's two parents are checked out below, by sha.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # The root lock file does not cover the excluded bench, so key the
          # cache on the bench's own.
          workspaces: crates/nanonbt-bench
      - name: install valgrind
        # `iai-callgrind` counts instructions under callgrind, and neither
        # side can run without valgrind. Both sides run in this job, under
        # this one valgrind, so the counts are comparable.
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      # Both sides of the comparison run the pull request's bench crate, so
      # the two revisions are measured by the same suite over their own
      # library sources; the base commit may not even carry this suite yet.
      - name: check out the base commit with the pull request's bench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --force --detach "$BASE_SHA"
          git checkout --force "$HEAD_SHA" -- crates/nanonbt-bench
      - name: read the runner version
        id: runner
        working-directory: crates/nanonbt-bench
        # The runner runs the benches, so it has to be the same version as
        # the `iai-callgrind` the bench crate builds against.
        run: |
          version=$(sed -n '/^name = "iai-callgrind"$/{n;s/^version = "\(.*\)"$/\1/;p}' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@${{ steps.runner.outputs.version }}

      # The cached target may hold summaries from another commit's run; a
      # comparison must start from this job's runs alone.
      - name: clear the iai-callgrind output
        working-directory: crates/nanonbt-bench
        run: rm -rf target/iai

      - name: bench the base commit
        working-directory: crates/nanonbt-bench
        # `--save-summary=json` writes one summary per entry below
        # `target/iai`, which the summarizer pairs up afterwards.
        run: cargo bench --locked --bench compare -- --save-summary=json
      - name: keep the base summaries
        working-directory: crates/nanonbt-bench
        # The head run below writes `target/iai` again, so move the base's
        # summaries out of its way; nothing has to travel between jobs.
        run: mv target/iai "$RUNNER_TEMP/base-iai"

      - name: check out the pull request
        run: git checkout --force --detach "${{ github.event.pull_request.head.sha }}"
      - name: bench the pull request
        working-directory: crates/nanonbt-bench
        run: cargo bench --locked --bench compare -- --save-summary=json

      - name: summarize
        working-directory: crates/nanonbt-bench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          cargo run --quiet --locked --no-default-features --example bench-summary -- \
            "$RUNNER_TEMP/base-iai" "$GITHUB_WORKSPACE/crates/nanonbt-bench/target/iai" \
            "$BASE_SHA" "$HEAD_SHA" "$BASE_REF" > "$GITHUB_WORKSPACE/bench-summary.md"

      # A pull request from a fork, or one Dependabot opened, runs with a
      # read-only token and cannot comment; its numbers are still in the log
      # above.
      - uses: marocchino/sticky-pull-request-comment@v3
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: bench
          path: bench-summary.md
