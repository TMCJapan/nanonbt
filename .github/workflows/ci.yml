name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Pinned, so that lints added by a new release cannot fail an unchanged
  # tree. Keep in step with `rust-version` in Cargo.toml.
  RUST_TOOLCHAIN: 1.98.1
  # The comparison bench needs `simdnbt`, which uses nightly features. Pinned
  # for the same reason as the stable toolchain above.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-09-17

jobs:
  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos
      - run: typos

  taplo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - run: taplo fmt --check --diff

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # Clippy, tests and release-mode tests on every host platform.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2025
          - name: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: nextest
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked
      - name: nextest --release
        run: cargo nextest run --workspace --all-features --locked --profile ci --release

  # The crates that must build without std.
  no-std:
    name: no-std (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabi, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: clippy
        run: cargo clippy -p nanonbt -p nanocesu8 --target ${{ matrix.target }} --locked -- -D warnings
      # The derive macro is a host build dependency; without it nanonbt is
      # the bare traits, which must still cross-compile.
      - name: clippy (no default features)
        run: cargo clippy -p nanonbt --target ${{ matrix.target }} --no-default-features --locked -- -D warnings
      - name: build
        run: cargo build -p nanonbt -p nanocesu8 --target ${{ matrix.target }} --locked --release
      - name: build (no default features)
        run: cargo build -p nanonbt --target ${{ matrix.target }} --no-default-features --locked --release
      # The `simd` feature must stay no_std as well; `wide` and `simdutf8`
      # are no_std with their default features off.
      - name: clippy (simd)
        run: cargo clippy -p nanocesu8 -p nanonbt --features nanocesu8/simd,nanonbt/simd --target ${{ matrix.target }} --locked -- -D warnings
      - name: build (simd)
        run: cargo build -p nanocesu8 -p nanonbt --features nanocesu8/simd,nanonbt/simd --target ${{ matrix.target }} --locked --release
      # The `hashify` feature re-exports, for the generated reads to call, the
      # macro that builds their lookups; the re-export must stay no_std too.
      - name: clippy (hashify)
        run: cargo clippy -p nanonbt --features hashify --target ${{ matrix.target }} --locked -- -D warnings

  # Model-checked agreement: nanonbt against fastnbt (crates/nanonbt-kani),
  # nanocesu8 against the cesu8 crate (crates/nanocesu8-kani).
  kani:
    runs-on: ubuntu-24.04
    # The proofs take about 19 minutes; `--harness-timeout` alone would let a
    # blown-up harness hold the required check for hours.
    timeout-minutes: 45
    env:
      KANI_VERSION: 0.67.0
    steps:
      - uses: actions/checkout@v7
      # Kani builds with its own pinned toolchain, which predates the
      # workspace's rust-version; the proofs use nothing newer than it has.
      # The grep is what fails the job if a bump ever leaves the sed with
      # nothing to rewrite, which sed itself reports as success.
      - name: match rust-version to Kani's toolchain
        run: |
          sed -i 's/^rust-version = .*/rust-version = "1.93"/' Cargo.toml
          grep -q '^rust-version = "1.93"$' Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # `cargo kani setup` unpacks CBMC and Kani's toolchain into ~/.kani,
      # which rust-cache does not cover on its own.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.kani
      - name: install kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # `cargo kani` takes no `--locked`, so this is the one job that may
      # resolve dependencies the others do not. About 1.5 GB per harness, so
      # four of them fit the runner's 16 GB.
      - name: prove
        run: cargo kani -p nanonbt-kani -Z stubbing -Z unstable-options --harness-timeout 300 --output-format terse -j 4
      - name: prove nanocesu8
        run: cargo kani -p nanocesu8-kani -Z stubbing -Z unstable-options --harness-timeout 300 --output-format terse -j 4

  # The comparison bench lives in its own workspace, `crates/nanonbt-bench`,
  # because `simdnbt` needs nightly. Compiling and linting it here keeps it
  # from rotting without moving the jobs above off the pinned stable
  # toolchain. The bench itself is not run: a shared runner times noise.
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The root lock file does not cover the excluded bench, so key the
          # cache on the bench's own.
          workspaces: crates/nanonbt-bench
      - name: fmt
        working-directory: crates/nanonbt-bench
        run: cargo fmt --all --check
      - name: clippy
        working-directory: crates/nanonbt-bench
        run: cargo clippy --all-targets --locked -- -D warnings

  # One required check for branch protection.
  ci:
    if: always()
    needs: [typos, taplo, fmt, machete, test, no-std, kani, bench]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
