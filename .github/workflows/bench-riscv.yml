name: Bench RISC-V

# RISC-V has no hosted runner, so this workflow emulates riscv64 with QEMU on
# an x86_64 runner and runs the callgrind suite inside the emulated
# container. Valgrind only learned riscv64 with 3.25, newer than the other
# jobs' valgrind, which is why the image is newer too. Emulated compilation
# and execution make this an order of magnitude slower than the hosted
# platforms, so it runs on dispatch alone and posts its own comment under its
# own header instead of joining `bench.yml`'s.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to comment on; leave empty to only run the bench
        required: false
        type: string
      ref:
        description: Branch, tag or sha to bench; defaults to the dispatched ref
        required: false
        type: string
      base-ref:
        description: Branch to compare against
        required: false
        default: main
        type: string
      image:
        description: riscv64 image with valgrind >= 3.25
        required: false
        default: ubuntu:26.04
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-09-17

jobs:
  riscv64:
    name: linux-riscv64
    runs-on: ubuntu-24.04
    # Emulated rustc and emulated callgrind are slow; a run that needs longer
    # wants a smaller suite, not a longer timeout.
    timeout-minutes: 350
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Both parents are checked out inside the container, by sha.
          fetch-depth: 0
      - name: resolve the two revisions
        id: revisions
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git merge-base HEAD "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
      - name: install the riscv64 emulator
        run: docker run --privileged --rm tonistiigi/binfmt --install riscv64
      - name: bench both revisions under QEMU
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          IMAGE: ${{ inputs.image }}
        run: |
          cat > "$RUNNER_TEMP/riscv-bench.sh" <<'SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install --yes --no-install-recommends \
            valgrind git curl ca-certificates build-essential

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain "$RUST_NIGHTLY_TOOLCHAIN" --profile minimal
          . "$HOME/.cargo/env"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          # Both sides run the dispatched revision's bench crate over their
          # own library sources, exactly as the hosted jobs do.
          git checkout --force --detach "$BASE_SHA"
          git checkout --force "$HEAD_SHA" -- crates/nanonbt-bench

          cd crates/nanonbt-bench
          runner_version=$(sed -n '/^name = "iai-callgrind"$/{n;s/^version = "\(.*\)"$/\1/;p}' Cargo.lock)
          cargo install --locked iai-callgrind-runner --version "$runner_version" --root "$HOME/iai"
          export PATH="$HOME/iai/bin:$PATH"

          rm -rf target/iai
          cargo bench --locked --bench compare -- --save-summary=json
          rm -rf "$GITHUB_WORKSPACE/riscv-out"
          mkdir -p "$GITHUB_WORKSPACE/riscv-out/base"
          cp -r target/iai/. "$GITHUB_WORKSPACE/riscv-out/base/"

          git -C "$GITHUB_WORKSPACE" checkout --force --detach "$HEAD_SHA"
          cargo bench --locked --bench compare -- --save-summary=json
          SCRIPT
          docker run --rm \
            --platform linux/riscv64 \
            --security-opt seccomp=unconfined \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env GITHUB_WORKSPACE --env BASE_SHA --env HEAD_SHA \
            --env RUST_NIGHTLY_TOOLCHAIN \
            "$IMAGE" bash "$RUNNER_TEMP/riscv-bench.sh"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-riscv64
          # The base summaries sit outside the target dir the head's run
          # wrote; both, so a failed run still hands over what it measured.
          path: |
            riscv-out
            crates/nanonbt-bench/target/iai
          if-no-files-found: warn

      # The container ran as root and wrote the target dir; give it back to
      # the runner before building the summarizer into it.
      - name: return the target dir to the runner
        run: |
          if [ -d crates/nanonbt-bench/target ]; then
            sudo chown -R "$(id -u):$(id -g)" crates/nanonbt-bench/target
          fi
      - name: summarize
        working-directory: crates/nanonbt-bench
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
          BASE_REF: ${{ inputs.base-ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cargo run --quiet --locked --no-default-features --example bench-summary -- \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --base-ref "$BASE_REF" \
            --run-url "$RUN_URL" --title "RISC-V benchmark results (emulated)" \
            --callgrind linux-riscv64 \
              "$GITHUB_WORKSPACE/riscv-out/base" \
              "$GITHUB_WORKSPACE/crates/nanonbt-bench/target/iai" \
            > "$GITHUB_WORKSPACE/bench-riscv.md"

      - uses: marocchino/sticky-pull-request-comment@v3
        if: inputs.pr != ''
        with:
          header: bench-riscv
          number: ${{ inputs.pr }}
          path: bench-riscv.md
