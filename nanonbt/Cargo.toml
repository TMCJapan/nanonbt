[package]
name = "nanonbt"
description = "Small NBT (Named Binary Tag) serializer with derive support and zero-copy array decoding."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]
# Note: `alloc::io::Read` is expected to stabilize in the future
# (rust-lang/rust#154046), at which point this feature can be updated.
# See: https://github.com/rust-lang/rust/issues/154046#issuecomment-4416678427

# Dispatches the names a derived read sees through hashify's perfect hash
# lookups instead of a `match`.
hashify = ["nanonbt-derive/hashify", "dep:hashify"]

[dependencies]
hashify = { workspace = true, optional = true }
nanocesu8 = { workspace = true }
nanonbt-derive = { workspace = true }

[lints]
workspace = true

[[test]]
name = "borrowed"
required-features = ["alloc"]

[[test]]
name = "errors"
required-features = ["alloc"]

[[test]]
name = "hashify"
required-features = ["alloc"]

[[test]]
name = "no_alloc"
required-features = ["alloc"]

[[test]]
name = "roundtrip"
required-features = ["alloc"]

[[example]]
name = "player"
required-features = ["alloc"]
