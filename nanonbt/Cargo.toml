[package]
name = "nanonbt"
description = "Small NBT (Named Binary Tag) serializer with derive support and zero-copy array decoding."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["alloc", "hashify"]
alloc = []
bytes = ["alloc", "dep:bytes"]
# serde support needs `alloc` for list buffering and error messages.
serde = ["alloc", "dep:serde"]
std = ["alloc"]
# Note: `alloc::io::Read` is expected to stabilize in the future
# (rust-lang/rust#154046), at which point this feature can be updated.
# See: https://github.com/rust-lang/rust/issues/154046#issuecomment-4416678427

hashify = ["nanonbt-derive/hashify", "dep:hashify"]

[dependencies]
hashify = { workspace = true, optional = true }
nanocesu8 = { workspace = true }
bytes = { version = "1", optional = true }
nanonbt-derive = { workspace = true }
serde = { workspace = true, optional = true, features = ["alloc"] }

[dev-dependencies]
ir-assert = "0.1"
serde = { workspace = true, features = ["derive", "std"] }
serde_bytes = "0.11"

[lints]
workspace = true

[[test]]
name = "borrowed"
required-features = ["alloc"]

[[test]]
name = "errors"
required-features = ["alloc"]

[[test]]
name = "hashify"
required-features = ["alloc"]

[[test]]
name = "no_alloc"
required-features = ["alloc"]

[[test]]
name = "roundtrip"
required-features = ["alloc"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "simd"
required-features = ["alloc"]

[[example]]
name = "player"
required-features = ["alloc"]
